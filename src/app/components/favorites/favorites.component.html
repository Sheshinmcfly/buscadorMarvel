@if (favSvc.count() === 0) {
  <div class="empty-state text-center py-5">
    <i class="bi bi-heart display-4 opacity-25"></i>
    <p class="mt-3 opacity-50">No tienes favoritos aún.<br>Agrega personajes desde su detalle.</p>
  </div>
} @else {
  <div class="fav-header mb-4 d-flex align-items-center justify-content-between">
    <span class="fav-count">{{ favSvc.count() }} favorito{{ favSvc.count() !== 1 ? 's' : '' }}</span>
  </div>

  <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-4">
    @for (char of favSvc.all(); track char.id) {
      <div class="col">
        <div class="fav-card">
          <button type="button" class="btn-remove" (click)="favSvc.toggle(char)" title="Quitar de favoritos"
                  [attr.aria-label]="'Quitar ' + char.name + ' de favoritos'">
            <i class="bi bi-heart-fill" aria-hidden="true"></i>
          </button>
          <div class="fav-img-wrapper">
            <img [src]="char.images.md" [alt]="char.name" class="fav-img" (error)="onImgError($event)">
            <div class="fav-placeholder">
              <span>{{ initials(char.name) }}</span>
            </div>
            <div class="fav-overlay"><i class="bi bi-eye-fill fs-4"></i></div>
          </div>
          <div class="fav-info px-2 py-2">
            <p class="fav-name mb-1">
              <button type="button" class="card-link" [attr.aria-label]="'Ver detalle de ' + char.name"
                      (click)="selectCharacter.emit(char)">{{ char.name }}</button>
            </p>
            <span class="badge {{ alignmentClass(char.biography.alignment) }}" style="font-size:0.7rem">
              {{ alignmentLabel(char.biography.alignment) }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>
}
