<form [formGroup]="form" (ngSubmit)="search()" class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">

    <div class="input-group input-group-lg search-group">
      <span class="input-group-text search-icon">
        <i class="bi bi-search"></i>
      </span>
      <input
        type="text"
        class="form-control search-input"
        formControlName="query"
        [placeholder]="isDC ? 'Ej: Batman, Superman, Wonder Woman...' : 'Ej: Spider-Man, Thor, Iron Man...'"
        autocomplete="off"
        [class.is-invalid]="query.invalid && query.touched"
      >
      @if (searched() && query.value) {
        <button type="button" class="btn btn-clear px-3" (click)="clear()" aria-label="Limpiar búsqueda">
          <i class="bi bi-x-lg"></i>
        </button>
      }
      <button type="submit" class="btn btn-search px-4">
        Buscar
      </button>
    </div>

    @if (query.invalid && query.touched) {
      <div class="text-warning small mt-1 ps-1">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        Ingresa al menos 2 caracteres.
      </div>
    }

  </div>
</form>
